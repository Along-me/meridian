name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify version tag
        shell: pwsh
        run: |
          ./.github/scripts/verify-version.ps1 -Tag $env:GITHUB_REF_NAME
      - run: npm ci
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop/make-icons.ps1
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist
      - name: Publish release with updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/installers/Meridian-Setup-$version-x64.exe"
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -eq 'false') { Write-Output 'This version is already published; keeping existing assets.'; exit 0 }
            throw 'A draft already exists. Review it before publishing; assets will not be overwritten.'
          }
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "Meridian $version" --generate-notes $installer "$installer.blockmap" release/installers/latest.yml
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed.' }
