name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lockVersion = (Get-Content package-lock.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version" -or $lockVersion -ne $version -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag and package versions must match a stable version.' }
      - run: npm ci
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop/make-icons.ps1
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist
      - name: Publish release with updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/Meridian-Setup-$version-x64.exe"
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "Meridian $version" --generate-notes $installer "$installer.blockmap" release/latest.yml
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed.' }
