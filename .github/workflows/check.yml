name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ./.github/scripts/verify-version.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop/make-icons.ps1
      - run: npm test
      - run: npm run test:desktop
